[project]
name = "wrap-brief"
version = "0.1.0"
description = "A modular, static-first Nintendo news hub."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["defusedxml==0.7.1"]

[dependency-groups]
dev = ["ruff==0.16.2"]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.4"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
