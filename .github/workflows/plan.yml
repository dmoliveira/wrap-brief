name: Validate delivery plan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Planning checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up pinned UV tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.7"
          enable-cache: false
      - name: Validate, test, lint and format
        run: make validate PYTHON='uv run --no-project --python 3.13 python' RUFF='uvx ruff==0.16.2'
      - name: Test minimum supported Python
        run: uv run --no-project --python 3.11 python -m unittest discover -s tests -v
      - name: Check change whitespace against first parent
        run: git diff --check HEAD^1 HEAD
