name: Validate project and delivery plan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Planning checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up pinned UV tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the locked Python foundation
        run: uv sync --locked --python 3.13
      - name: Validate, test, lint and format
        run: make validate
      - name: Test minimum supported Python
        run: uv run --locked --python 3.11 python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Verify planning tools remain standalone
        run: uv run --no-project --python 3.11 python -m unittest discover -s tests -p test_plan.py -v
      - name: Build and install an isolated wheel
        run: make test-wheel
      - name: Verify fixed scanner binaries for synthetic public outputs
        run: python3 tools/check_security.py bootstrap --directory "$RUNNER_TEMP/artifact-security-bin"
      - name: Build and scan the exact synthetic HTML and CSS output inventory
        shell: bash
        run: |
          for case in digest corrected empty; do
            uv run --locked python tools/build_fixture_site.py "$case"
          done
          make check-artifacts GITLEAKS="$RUNNER_TEMP/artifact-security-bin/gitleaks"
      - name: Check change whitespace against first parent
        run: git diff --check HEAD^1 HEAD
